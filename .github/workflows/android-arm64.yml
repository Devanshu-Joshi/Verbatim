name: android-arm64

# Manual / branch-push build of the arm64 (real phone) debug APK.
# Mirrors .github/workflows/android.yml's e2e build, adapted:
# x86_64 -> aarch64, sherpa arm64 lib, no emulator/Maestro steps,
# and the APK is uploaded as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: ["arm64-apk-build"]
    paths:
      - ".github/workflows/android-arm64.yml"

env:
  NDK_VERSION: "28.2.13676358"
  SHERPA_ONNX_VERSION: "1.13.3"

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install NDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: bun install --frozen-lockfile
      - name: Download official sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sherpa-onnx-v${SHERPA_ONNX_VERSION}-android.tar.bz2"
          extract_dir="$RUNNER_TEMP/sherpa-onnx-android"
          curl -L -o "$archive" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-android.tar.bz2"
          mkdir -p "$extract_dir"
          tar -xjf "$archive" -C "$extract_dir"
          lib_path="$(find "$extract_dir" -type f -path '*/arm64-v8a/*' -name 'libsherpa-onnx-c-api.so' -print -quit)"
          if [[ -z "$lib_path" ]]; then
            echo "Unable to find arm64-v8a libsherpa-onnx-c-api.so in official sherpa-onnx Android archive" >&2
            exit 1
          fi
          echo "SHERPA_ONNX_LIB_DIR=$(dirname "$lib_path")" >> "$GITHUB_ENV"
      - name: Build debug APK (aarch64 for real phones)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_E2E_FEATURES: android-asr android-e2e-bundled-frontend
          TAURI_CONFIG: '{"build":{"devUrl":null}}'
        run: |
          bun run tauri android build --debug --target aarch64 --apk --features "$ANDROID_E2E_FEATURES" \
            --config "$TAURI_CONFIG"
      - name: Stage bundled frontend assets in debug APK
        working-directory: src-tauri/gen/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_E2E_FEATURES: android-asr android-e2e-bundled-frontend
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="app/src/main/assets"
          gradle_file="app/build.gradle.kts"

          test -f "../../../dist/index.html" || {
            echo "::error::frontend build missing dist/index.html"
            exit 1
          }

          grep -Fq 'features = "android-asr"' "$gradle_file" || {
            echo "::error::expected generated Android Rust feature list not found in $gradle_file"
            exit 1
          }
          perl -0pi -e 's/features = "android-asr"/features = "$ENV{ANDROID_E2E_FEATURES}"/' "$gradle_file"
          grep -Fq "features = \"$ANDROID_E2E_FEATURES\"" "$gradle_file" || {
            echo "::error::failed to enable bundled-frontend Rust feature for Android arm64 debug APK"
            exit 1
          }

          mkdir -p "$assets_dir"
          cp -R ../../../dist/. "$assets_dir/"

          bash ./gradlew :app:assembleUniversalDebug \
            -PtargetList=aarch64 \
            -ParchList=arm64 \
            -PabiList=arm64-v8a
      - name: Resolve APK path
        id: apk
        run: |
          set -e
          base="src-tauri/gen/android/app/build/outputs/apk"
          apk="$base/universal/debug/app-universal-debug.apk"
          test -f "$apk" || apk="$(find "$base" -name 'app-*-debug.apk' | head -1)"
          test -f "$apk" || { echo "::error::debug APK not found under $base"; exit 1; }
          ls -lh "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbatim-0.14.3-arm64-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
